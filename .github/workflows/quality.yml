name: Windows quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run integrated Windows verification
        run: npm run verify:project
        env:
          ZINECV_VERIFY_SUITE: ci

      - name: Preserve runner evidence and stage logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zinecv-verification-${{ github.run_id }}
          path: .artifacts/verification-runs
          if-no-files-found: warn
          retention-days: 14
