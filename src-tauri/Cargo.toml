[package]
name = "zinecv-desktop"
version = "2.0.0-alpha.1"
description = "ZineCV desktop application"
authors = ["ZineCV contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "zinecv_desktop_lib"
# Desktop binaries link the Rust library; mobile hosts must opt into their ABI output.
crate-type = ["rlib"]

[features]
# 仅测试构建启用：转发到 zinecv-storage 的发布边界注入钩子（钩子实现
# 已随 P3b 迁入 storage crate），release 构建不含这些钩子。
test-hooks = ["zinecv-storage/test-hooks"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
base64 = "0.22.1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
typst = "=0.15.1"
serde = { version = "1.0.229", features = ["derive"] }
# C+ Phase 1a：领域 schema 与逻辑的跨端单源（原 domain.rs；经 src-tauri/src/domain.rs 再出口保持引用路径不变）。
zinecv-contracts = { path = "../crates/zinecv-contracts" }
zinecv-domain = { path = "../crates/zinecv-domain" }
# C+ P2：Typst 排版引擎（原 src/engine.rs + engine/*；经 src-tauri/src/engine.rs glob 再出口）。
zinecv-engine = { path = "../crates/zinecv-engine" }
# C+ P3b/P4：存储与 Agent 语义 crate（lib.rs 以模块再出口接线，无垫片文件）。
zinecv-storage = { path = "../crates/zinecv-storage" }
zinecv-agent = { path = "../crates/zinecv-agent" }
zinecv-native = { path = "../crates/zinecv-native" }
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "net"] }
# Native save dialogs for export output (IFileDialog on Windows).
rfd = "0.15"
# Windows 自动更新：官方 updater 插件的 Rust 侧包装（src/app_update.rs）。
# 版本选择：2.12 是要求 tauri ^2.10 的最后一线（2.13+ 要求 tauri 2.12，
# 与锁定的 @tauri-apps/api 2.11 minor 不匹配）；JS 直连权限不开，仅经
# 五个业务命令暴露。
tauri-plugin-updater = "=2.12.0"
minisign-verify = "=0.2.5"
semver = "1"
time = "0.3"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# typst-layout/pdf/render/svg 仅剩受保护示例（typst_poc / engine_render）使用；
# 排版主体已随 zinecv-engine 迁出，正式宿主二进制不再链接这四个子 crate。
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
