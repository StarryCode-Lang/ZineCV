[package]
name = "zinecv-desktop"
version = "2.0.0-alpha.0"
description = "ZineCV desktop application"
authors = ["ZineCV contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "zinecv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 仅测试构建启用：转发到 zinecv-storage 的发布边界注入钩子（钩子实现
# 已随 P3b 迁入 storage crate），release 构建不含这些钩子。
test-hooks = ["zinecv-storage/test-hooks"]

# 极致轻量化：发布构建以体积为先。
# - lto = "fat" + codegen-units = 1：跨 crate 内联/去重（本包 735 个依赖，
#   其中 Typst 全家桶与 rustls 占代码量大头）。
# - panic = "abort"：移除 unwind 落地垫与 panic 元数据；worker 崩溃重放依赖
#   进程退出（Job Object + 管道 EOF），不依赖线程展开，因此语义不变。
# - strip = "symbols"：exe 不携带符号表（调试信息仍在独立 PDB 中）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Test executable stays outside target/release and cannot replace production.
# 仅用于故障注入验证，不是发布产物；用 thin LTO 换取更短的测试构建时间。
[profile.hooks]
inherits = "release"
lto = "thin"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
base64 = "0.22.1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
typst = "=0.15.1"
serde = { version = "1.0.229", features = ["derive"] }
# C+ Phase 1a：领域 schema 与逻辑的跨端单源（原 domain.rs；经 src-tauri/src/domain.rs 再出口保持引用路径不变）。
zinecv-contracts = { path = "../crates/zinecv-contracts" }
zinecv-domain = { path = "../crates/zinecv-domain" }
# C+ P2：Typst 排版引擎（原 src/engine.rs + engine/*；经 src-tauri/src/engine.rs glob 再出口）。
zinecv-engine = { path = "../crates/zinecv-engine" }
# C+ P3b/P4：存储与 Agent 语义 crate（lib.rs 以模块再出口接线，无垫片文件）。
zinecv-storage = { path = "../crates/zinecv-storage" }
zinecv-agent = { path = "../crates/zinecv-agent" }
zinecv-native = { path = "../crates/zinecv-native" }
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "net"] }
# Native save dialogs for export output (IFileDialog on Windows).
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# typst-layout/pdf/render/svg 仅剩受保护示例（typst_poc / engine_render）使用；
# 排版主体已随 zinecv-engine 迁出，正式宿主二进制不再链接这四个子 crate。
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
