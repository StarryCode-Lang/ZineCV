[build]
target-dir = "src-tauri/target"
jobs = 2

# Independent Cargo roots must use the same development/test settings, including
# when invoked via --manifest-path. Keep line numbers for panic backtraces;
# full local-variable/type debugging can be enabled explicitly per invocation.
# Retain incremental compilation for frequently edited local crates.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

[profile.dev.build-override]
debug = 0
strip = "symbols"

[profile.test.build-override]
debug = 0
strip = "symbols"

[profile.release.build-override]
debug = 0
strip = "symbols"

# P6 Web 腿：getrandom 0.3 的 wasm32 JS 后端要求目标级 cfg
# （必须与 zinecv-contracts 的 `wasm` 特性同时启用；native 构建不受影响）。
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]
