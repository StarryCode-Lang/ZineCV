<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZineCV 旧版浏览器数据导出</title>
    <style>
      body { font: 16px/1.6 system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 0 1.5rem; color: #202124; }
      h1 { font-size: 1.6rem; line-height: 1.3; }
      button { padding: .7rem 1.1rem; border: 0; border-radius: .45rem; background: #202124; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #status { min-height: 1.6em; margin-top: 1rem; }
      .note { color: #50545a; }
    </style>
  </head>
  <body>
    <main>
      <h1>导出旧版浏览器数据</h1>
      <p>请在原来使用简历的浏览器中，从 <strong>http://127.0.0.1:5173/legacy-export.html</strong> 打开本页。点击后仅读取这个站点中名称以 <code>resume-diy-</code> 开头的浏览器记录，下载到您的电脑；不会修改或清空原记录。</p>
      <p class="note">项目文件 <code>.data/versions.json</code>、备份文件和账户数据不在浏览器缓存里，须另行保留并导入。导出的文件可能包含简历、会话和私人信息，请自行妥善保管。</p>
      <button id="export" type="button">下载浏览器数据</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module">
      const button = document.querySelector("#export");
      const status = document.querySelector("#status");
      const expectedOrigin = "http://127.0.0.1:5173";
      if (location.origin !== expectedOrigin) {
        button.disabled = true;
        status.textContent = `当前地址不是 ${expectedOrigin}，请从旧版项目地址打开。`;
      }
      button.addEventListener("click", async () => {
        if (location.origin !== expectedOrigin || button.disabled) return;
        button.disabled = true;
        status.textContent = "正在读取当前站点的浏览器记录…";
        try {
          const entries = [];
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (key?.startsWith("resume-diy-")) {
              const value = localStorage.getItem(key);
              if (value !== null) entries.push([key, value]);
            }
          }
          entries.sort(([left], [right]) => left.localeCompare(right));
          const encoded = new TextEncoder().encode(JSON.stringify(entries));
          const hash = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", encoded)),
            (byte) => byte.toString(16).padStart(2, "0")).join("");
          const exportFile = {
            format: "zinecv-legacy-browser-export",
            version: 1,
            origin: location.origin,
            exportedAt: new Date().toISOString(),
            sourceHash: hash,
            entries,
          };
          const url = URL.createObjectURL(new Blob([JSON.stringify(exportFile, null, 2)], { type: "application/json" }));
          const link = document.createElement("a");
          link.href = url;
          link.download = `zinecv-legacy-browser-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.append(link);
          link.click();
          link.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 60_000);
          status.textContent = `已生成 ${entries.length} 条浏览器记录的本地下载；原记录未修改。`;
        } catch {
          status.textContent = "导出失败；原记录未修改。请确认浏览器允许读取本站点数据和下载文件。";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
