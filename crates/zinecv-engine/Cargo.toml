[package]
name = "zinecv-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ZineCV 排版引擎：官方 Typst crates、三模板、TextMap/HitRegion、一页求解与统一导出"

[dependencies]
zinecv-contracts = { path = "../zinecv-contracts" }
serde_json = "1"
base64 = "0.22.1"
sha2 = "0.10"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
# Reuse Typst's locked raster buffer for bounded, exact-size page/long PNG output.
tiny-skia = "=0.12.0"
ttf-parser = "0.25"
# Reuse the bidi implementation already locked by Typst; no second JS text engine.
unicode-bidi = "=0.3.18"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "=1.1.0"
