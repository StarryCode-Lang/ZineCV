[package]
name = "zinecv-ohos"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "OpenHarmony native core compilation and NAPI probe"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
zinecv-contracts = { path = "../zinecv-contracts" }
zinecv-domain = { path = "../zinecv-domain" }
zinecv-engine = { path = "../zinecv-engine" }
zinecv-storage = { path = "../zinecv-storage" }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "serialize"] }
serde_json = "1"
[build-dependencies]
cc = "1"
