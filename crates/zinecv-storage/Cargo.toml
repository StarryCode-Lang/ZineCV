[package]
name = "zinecv-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ZineCV 存储语义：Store/事务/CAS/版本图/备份恢复/资源/提案持久化 + legacy 迁移 + 账户与秘密"

[features]
# 仅测试构建启用：发布边界注入暂停点（原 src-tauri 同名 feature，
# 宿主经 feature 转发启用），验证发布/恢复的可中断性。
test-hooks = []
wasm = ["zinecv-contracts/wasm"]

[dependencies]
zinecv-contracts = { path = "../zinecv-contracts" }
zinecv-domain = { path = "../zinecv-domain" }
# resources 的引擎来源指纹与字体字节（FONT_* 静态）取自 engine crate——
# 文档化的边界妥协：仅常量消费，WebStore 路径（无 rusqlite/resources）不受影响。
zinecv-engine = { path = "../zinecv-engine" }
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22.1"
scrypt = "0.11"
subtle = "2"
getrandom = "0.3"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "=1.1.0"

[dev-dependencies]
zinecv-native = { path = "../zinecv-native" }
# 迁移测试内的 ts-rs 绑定冒烟（export_to_string 遍历）只需 trait 在作用域。
ts-rs = "12"
