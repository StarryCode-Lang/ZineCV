[package]
name = "zinecv-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ZineCV WASM facade over the shared Rust domain and document engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["engine", "store", "agent"]
engine = ["dep:zinecv-engine"]
store = ["dep:zinecv-storage", "dep:rusqlite"]
agent = ["dep:zinecv-agent", "dep:tokio"]

[dependencies]
zinecv-contracts = { path = "../zinecv-contracts", features = ["wasm"] }
zinecv-domain = { path = "../zinecv-domain" }
zinecv-engine = { path = "../zinecv-engine", optional = true }
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.22.1"
sha2 = "0.10"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
zinecv-storage = { path = "../zinecv-storage", features = ["wasm"], optional = true }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "serialize"], optional = true }
zinecv-agent = { path = "../zinecv-agent", optional = true }
tokio = { version = "1.53.1", features = ["sync"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = "=0.5.5"
sqlite-wasm-vfs = "=0.2.0"
wasm-bindgen-futures = "=0.4.79"
getrandom-legacy = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = "thin"
