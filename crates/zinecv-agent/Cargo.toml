[package]
name = "zinecv-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "ZineCV Agent 语义：Provider 协议/gateway 传输、流式会话、Proposal 生成与上下文组装"

[dependencies]
zinecv-contracts = { path = "../zinecv-contracts" }
zinecv-storage = { path = "../zinecv-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tokio = { version = "1.53.1", features = ["sync"] }
url = "=2.5.8"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { version = "1.53.1", features = ["time", "macros", "net"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "=1.1.0"
gloo-timers = { version = "=0.3.0", features = ["futures"] }
futures-util = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"

[dev-dependencies]
zinecv-domain = { path = "../zinecv-domain" }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
