[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/zinecv-contracts",
    "crates/zinecv-domain",
    "crates/zinecv-engine",
    "crates/zinecv-storage",
    "crates/zinecv-agent",
    "crates/zinecv-native",
    "crates/zinecv-assets",
]
default-members = ["src-tauri"]
# Separate platform release policies and toolchains remain opt-in.
exclude = ["crates/zinecv-wasm", "crates/zinecv-ohos"]

# 极致轻量化：发布构建以体积为先。
# - lto = "fat" + codegen-units = 1：跨 crate 内联/去重（共享核心与宿主依赖中，
#   其中 Typst 全家桶与 rustls 占代码量大头）。
# - panic = "abort"：移除 unwind 落地垫与 panic 元数据；worker 崩溃重放依赖
#   进程退出（Job Object + 管道 EOF），不依赖线程展开，因此语义不变。
# - strip = "symbols"：exe 不携带符号表（调试信息仍在独立 PDB 中）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
incremental = false

# 第三方依赖不承载本地调试行号；本项目保留行号与 dev 增量编译。
[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0

# 构建脚本与 proc-macro 只参与编译，剥离其符号不影响产物运行或本地调试。
[profile.dev.build-override]
debug = 0
strip = "symbols"

[profile.test.build-override]
debug = 0
strip = "symbols"

[profile.release.build-override]
debug = 0
strip = "symbols"
